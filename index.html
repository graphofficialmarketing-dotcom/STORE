<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บอร์ดโปรโมชั่นประจำสาขา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#fafaf8; --paper:#fff; --ink:#111; --char:#282826; --muted:#76746e; --line:#e3e2dd; --soft:#f2f1ed;
  --red:#af2524; --green:#4aad48; --green-ink:#2e7a2c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Jost",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px 72px}
.kicker{font-family:"Jost",sans-serif;font-weight:500;font-size:12px;letter-spacing:.28em;text-transform:uppercase}
.muted{color:var(--muted)}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--ink)}
.bar .date{font-size:14px;color:var(--muted)}
.bar-l{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brands{display:flex;gap:6px}
.brands img{width:40px;height:40px;border-radius:4px;display:block;border:1px solid var(--line)}

/* buttons */
.btn{border:1px solid var(--ink);background:transparent;border-radius:4px;padding:8px 16px;font-size:14.5px;font-weight:500;line-height:1.3;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--ink);color:#fff}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:#333}
.btn.ghost{border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn.del{border-color:var(--line);color:var(--red)}
.btn.del:hover{border-color:var(--red);background:var(--red);color:#fff}
.btn.sm{padding:5px 11px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* hero */
.hero{display:flex;align-items:center;gap:20px;padding:34px 0 26px;flex-wrap:wrap}
.logo{width:68px;height:68px;border-radius:6px;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--paper)}
.logo img{width:100%;height:100%;display:block}
.logo.txt{font-family:"Jost";font-weight:600;font-size:11px;letter-spacing:.14em;text-align:center;padding:4px}
.hero-main{flex:1;min-width:240px}
.hero-main .kicker{color:var(--muted)}
.bsel{position:relative;display:inline-flex;align-items:center;max-width:100%;margin-top:4px}
.bsel select{appearance:none;-webkit-appearance:none;font:inherit;font-family:"Jost","IBM Plex Sans Thai",sans-serif;font-weight:500;font-size:clamp(26px,4vw,40px);letter-spacing:.04em;line-height:1.2;color:var(--ink);background:transparent;border:none;border-bottom:2px solid var(--ink);border-radius:0;padding:2px 46px 6px 0;cursor:pointer;max-width:100%;text-overflow:ellipsis}
.bsel select:focus{outline:none;border-bottom-color:var(--red)}
.bsel .chev{position:absolute;right:4px;top:50%;transform:translateY(-55%);pointer-events:none;width:26px;height:26px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{background:none;border:none;border-right:1px solid var(--line);padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:2px}
.stat:last-child{border-right:none}
.stat b{font-family:"Jost";font-weight:500;font-size:32px;line-height:1.1}
.stat span{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.stat:hover{background:var(--soft)}
.stat.on{background:var(--ink);color:#fff}
.stat.on span{color:#ddd}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-active{background:var(--green)} .d-soon{background:var(--red)} .d-up{background:transparent;border:1.5px solid currentColor} .d-off{background:#bbb}

/* sections */
.sec{margin-top:40px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:15px;font-weight:600}
.sec-h .n{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.empty{color:var(--muted);padding:22px;border:1px dashed var(--line);border-radius:4px;text-align:center;font-size:15px}
.clear{margin-top:18px}

/* card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card.st-soon{border-color:var(--red)}
.card.st-off{opacity:.6}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meta .lbl{font-size:12.5px}
.state{font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.st-soon .state{color:var(--red)}
.st-active .state{color:var(--green-ink)}
.card h3{font-size:21px;line-height:1.3}
.sub{font-size:14px;color:var(--muted);margin-top:-6px}
.period{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.period b{display:block;font-size:17px;font-weight:600}
.period span{font-size:13.5px;color:var(--muted)}
.detail{margin:0;font-size:15.5px}
.cond{margin:0;font-size:14.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:15px}
.facts dt{color:var(--muted);font-size:14px}
.facts dd{margin:0}
.todo{background:var(--soft);border-radius:4px;padding:12px 14px}
.todo .kicker{font-size:11px;margin-bottom:4px;display:block}
.todo ul{margin:0;padding-left:18px}
.todo li{margin:2px 0;font-size:15px}
.prep{font-size:14.5px;display:flex;gap:8px}
.prep b{font-weight:600}
.code{align-self:flex-start;font-family:ui-monospace,Menlo,monospace;font-size:13px;border:1px solid var(--line);padding:2px 8px;border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:#444;background:var(--paper)}
.chip.warn{border-color:var(--red);color:var(--red)}
.prog{margin-top:auto;padding-top:4px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.prog .bar2{flex:1;height:3px;background:var(--soft);border-radius:2px;overflow:hidden}
.prog .bar2 i{display:block;height:100%;background:var(--ink)}
.st-soon .prog .bar2 i{background:var(--red)}
.st-active .prog .bar2 i{background:var(--green)}
.foot{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* marketing */
.mk-head{padding:34px 0 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.mk-head h1{font-size:clamp(24px,3.4vw,34px);margin-top:6px}
.mk-head p{margin:6px 0 0;color:var(--muted);font-size:15px}
.saver{font-size:13.5px;display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.saver.err{color:var(--red)}
.adds{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.add{border:1px solid var(--ink);background:var(--paper);border-radius:6px;padding:20px 22px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px}
.add:hover{background:var(--ink);color:#fff}
.add:hover .muted{color:#ccc}
.add b{font-size:18px;font-weight:600;display:block}
.add .plus{font-family:"Jost";font-size:34px;font-weight:400;line-height:1}
.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--paper)}
.seg button{border:none;background:none;padding:7px 14px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff}
.list{border-top:1px solid var(--ink)}
.li{display:grid;grid-template-columns:150px 1fr 230px 200px auto;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);background:transparent}
.li:hover{background:var(--paper)}
.li .t{font-weight:600;font-size:16px;line-height:1.35}
.li .s{font-size:13.5px;color:var(--muted)}
.li .when{font-size:14px}
.li .acts{display:flex;gap:6px;justify-content:flex-end}
.li .st{font-size:13.5px;display:flex;align-items:center;gap:7px;font-weight:500}
.li.st-off{opacity:.6}
.tag{display:inline-block;font-family:"Jost";font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin-top:4px;color:var(--muted)}
.tag.ev{border-color:var(--char);color:var(--char)}
.note{font-size:13.5px;color:var(--muted);margin-top:14px}
.warn{border:1px solid var(--red);color:var(--red);border-radius:4px;padding:10px 14px;font-size:14.5px;margin-bottom:18px}
.login{max-width:420px;margin:56px 0}
.login h1{font-size:26px;margin:6px 0 20px}

/* dialog */
.ov{position:fixed;inset:0;background:rgba(17,17,17,.42);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.show{display:flex}
.dlg{background:var(--paper);border-radius:8px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:24px 24px 18px}
.dlg h2{font-size:21px;margin:4px 0 16px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld label,.fld .lb{font-size:13.5px;font-weight:600;color:#333}
.fld .hint{font-size:12.5px;color:var(--muted);font-weight:400}
.fld input,.fld textarea,.fld select{font:inherit;font-size:15.5px;padding:9px 11px;border:1px solid #d6d5cf;border-radius:4px;background:#fff;color:var(--ink)}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.fld textarea{min-height:72px;resize:vertical}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;border:1px solid #d6d5cf;border-radius:4px;padding:10px 12px;max-height:220px;overflow:auto}
.checks label{font-weight:400;font-size:14.5px;display:flex;gap:8px;align-items:center}
.checks .all{grid-column:1/-1;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.brow{display:grid;grid-template-columns:1fr 170px auto;gap:8px;margin-bottom:8px}
.brow input,.brow select{font:inherit;font-size:15px;padding:7px 10px;border:1px solid #d6d5cf;border-radius:4px}
.err{color:var(--red);font-size:14px;min-height:20px}
.dlg-act{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
.copybox{width:100%;min-height:240px;font:13.5px/1.5 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--line);border-radius:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;font-size:14.5px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:860px){
  .li{grid-template-columns:1fr auto;gap:6px 12px}
  .li>.st{grid-column:1/-1}
  .li>.main{grid-column:1/-1}
  .li>.when{grid-column:1/-1}
  .li>.br{grid-column:1/2}
}
@media (max-width:720px){
  .wrap{padding:0 16px 56px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:none}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .adds,.two,.checks{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .hero{padding:24px 0 20px;gap:14px}
  .logo{width:54px;height:54px}
  .brands img{width:32px;height:32px}
  .bar-l{gap:10px}
  .bsel select{font-size:clamp(20px,6vw,28px);letter-spacing:.02em;padding-right:36px}
  .bar .date{text-align:right}
  .brow{grid-template-columns:1fr auto}
  .brow select{grid-column:1/2}
}
</style>
</head>

<script id="main">
(function(){
  const PROMO_CATS=["กิจกรรมสะสมแสตมป์","ส่วนลด","ซื้อ 1 แถม 1","แลกซื้อ","สมาชิก","ช่องทางชำระเงิน","ของแถม","กิจกรรม/แคมเปญ","อื่นๆ"];
  const BRANDS=[["graph","GRAPH"],["general","general coffee"],["roamer","ROAMER BURGER"],["earth","earth tone"],["masando","MASANDO"],["other","อื่น ๆ"]];
  const SOON_DAYS=3, MK="marketing";
  const LOGOS=JSON.parse(document.getElementById("logos").textContent);
  const raw=document.getElementById("state").textContent;
  let saved=JSON.parse(raw), state=JSON.parse(raw);
  let route="all", filter="all", showOff=false, mkType="all", mkTime="now", saving="idle";
  let version=0, dbOk=null, loaded=false, pw="";
  try{pw=sessionStorage.getItem("pb_pw")||"";}catch(e){}
  const app=document.getElementById("app");
  const clone=o=>JSON.parse(JSON.stringify(o));

  /* ---------- dates ---------- */
  function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function toDay(iso){const [y,m,d]=iso.split("-").map(Number);return Date.UTC(y,m-1,d)/86400000;}
  function fmt(iso,mode){if(!iso)return "";const [y,m,d]=iso.split("-").map(Number);const o=mode==="full"?{weekday:"long",day:"numeric",month:"long",year:"numeric"}:mode==="long"?{day:"numeric",month:"long",year:"numeric"}:mode==="wk"?{weekday:"short",day:"numeric",month:"short",year:"2-digit"}:{day:"numeric",month:"short",year:"2-digit"};try{return new Date(y,m-1,d).toLocaleDateString("th-TH",o);}catch(e){return iso;}}
  function range(p,mode){return p.start===p.end?fmt(p.start,mode):fmt(p.start,mode)+" – "+fmt(p.end,mode);}
  const time=p=>p.timeStart?(p.timeStart+(p.timeEnd?"–"+p.timeEnd:"")+" น."):"";
  const dur=p=>toDay(p.end)-toDay(p.start)+1;
  function status(p,t){
    const s=toDay(p.start),e=toDay(p.end),n=toDay(t);
    if(n<s) return {k:"up",label:(s-n===1?"พรุ่งนี้":(p.type==="event"?"อีก ":"เริ่มในอีก ")+(s-n)+" วัน"),pct:0};
    if(n>e) return {k:"off",label:p.type==="event"?"จบแล้ว":"หมดแล้ว",pct:100};
    const left=e-n, pct=Math.round(((n-s+1)/(e-s+1))*100);
    if(s===e) return {k:"soon",label:"วันนี้",pct:100};
    if(left===0) return {k:"soon",label:"วันสุดท้าย",pct};
    if(left<SOON_DAYS) return {k:"soon",label:"เหลือ "+(left+1)+" วัน",pct};
    return {k:"active",label:"เหลือ "+(left+1)+" วัน",pct};
  }

  /* ---------- helpers ---------- */
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const lines=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
  function toast(msg){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);}t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}
  const branch=id=>state.branches.find(x=>x.id===id);
  const bName=id=>{const b=branch(id);return b?b.name:id;};
  const items=()=>state.items||[];
  function visible(){return items().filter(p=>route==="all"||(p.branches||[]).includes(route));}
  function groups(list){
    const t=todayISO(), g={active:[],soon:[],up:[],off:[]};
    list.forEach(p=>{const st=status(p,t);g[st.k].push({p,st});});
    const byEnd=(a,b)=>a.p.end.localeCompare(b.p.end), byStart=(a,b)=>(a.p.start+(a.p.timeStart||"")).localeCompare(b.p.start+(b.p.timeStart||""));
    g.soon.sort(byEnd);g.active.sort(byEnd);g.up.sort(byStart);g.off.sort((a,b)=>b.p.end.localeCompare(a.p.end));
    return g;
  }
  const dotHTML=k=>'<i class="dot d-'+k+'"></i>';
  function logoHTML(id){
    const b=id==="all"?{brand:"graph",name:state.brand}:branch(id);
    const L=b&&LOGOS[b.brand];
    if(L) return '<div class="logo" style="background:'+L.bg+';border-color:'+(L.bg==="#ffffff"?"var(--line)":L.bg)+'"><img src="'+L.src+'" alt="'+esc(b.name)+'"></div>';
    return '<div class="logo txt">'+esc(b?b.name:"")+'</div>';
  }
  function brandsHTML(){return '<div class="brands">'+["graph","general","roamer","earth","masando"].filter(k=>LOGOS[k]).map(k=>'<img src="'+LOGOS[k].src+'" alt="'+k+'">').join("")+'</div>';}
  function readHash(){
    const h=decodeURIComponent((location.hash||"").slice(1));
    if(h===MK){route=MK;return;}
    route=state.branches.some(b=>b.id===h)?h:"all";
  }

  /* ================= STORE VIEW ================= */
  function chipsHTML(p){
    const ids=(p.branches||[]).filter(id=>branch(id));
    if(!ids.length) return '<div class="chips"><span class="chip warn">ยังไม่ได้เลือกสาขา</span></div>';
    if(ids.length===state.branches.length) return '<div class="chips"><span class="chip">ทุกสาขา</span></div>';
    return '<div class="chips">'+ids.map(id=>'<span class="chip">'+esc(bName(id))+'</span>').join("")+'</div>';
  }
  function todoHTML(p,title){const t=lines(p.staff);return t.length?'<div class="todo"><span class="lbl" style="display:block;margin-bottom:4px;color:var(--ink)">'+title+'</span><ul>'+t.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>':"";}
  function promoCard({p,st}){
    const t=todayISO();
    const prep=(st.k==="up"&&(p.prep||p.prepDate))?'<div class="prep"><span>📦</span><span>'+esc(p.prep||"เตรียมก่อนเริ่ม")+(p.prepDate?' <b>ภายใน '+fmt(p.prepDate)+'</b>':'')+'</span></div>':"";
    return '<article class="card st-'+st.k+'">'+
      '<div class="meta"><span class="lbl">'+esc(p.category||"โปรโมชั่น")+'</span><span class="state">'+dotHTML(st.k)+esc(st.label)+'</span></div>'+
      '<h3>'+esc(p.title)+'</h3>'+(p.org?'<div class="sub">'+esc(p.org)+'</div>':'')+
      '<div class="period"><b>'+range(p,"long")+'</b><span>ระยะเวลา '+dur(p)+' วัน</span></div>'+
      (p.detail?'<p class="detail">'+esc(p.detail)+'</p>':'')+
      (p.cond?'<p class="cond">เงื่อนไข · '+esc(p.cond)+'</p>':'')+
      todoHTML(p,"หน้าร้านต้องทำ")+prep+
      (p.code?'<span class="code">'+esc(p.code)+'</span>':'')+
      (route==="all"?chipsHTML(p):'')+
      (st.k==="up"?'':'<div class="prog"><span class="bar2"><i style="width:'+st.pct+'%"></i></span><span>'+st.pct+'%</span></div>')+
    '</article>';
  }
  function eventCard({p,st}){
    const facts=[["สถานที่",p.location],["จำนวน",p.cups?p.cups+" แก้ว":""],["เมนู",p.menu],["ผู้ประสานงาน",p.contact]].filter(x=>x[1]);
    return '<article class="card st-'+st.k+'">'+
      '<div class="meta"><span class="lbl">งานแจกกาแฟ</span><span class="state">'+dotHTML(st.k)+esc(st.label)+'</span></div>'+
      '<h3>'+esc(p.title)+'</h3>'+(p.client?'<div class="sub">'+esc(p.client)+'</div>':'')+
      '<div class="period"><b>'+range(p,"wk")+'</b><span>'+(time(p)||"ยังไม่ระบุเวลา")+'</span></div>'+
      (facts.length?'<dl class="facts">'+facts.map(f=>'<dt>'+f[0]+'</dt><dd>'+esc(f[1])+'</dd>').join("")+'</dl>':'')+
      (p.detail?'<p class="cond">หมายเหตุ · '+esc(p.detail)+'</p>':'')+
      todoHTML(p,"ทีมต้องเตรียม")+
      (route==="all"?chipsHTML(p):'')+
    '</article>';
  }
  const cardHTML=x=>x.p.type==="event"?eventCard(x):promoCard(x);
  function section(key,title,list){
    if(filter!=="all"&&filter!==key&&!(filter==="active"&&key==="soon")) return "";
    if(!list.length&&key!=="active") return "";
    return '<section class="sec"><div class="sec-h"><h2>'+title+'</h2><span class="n">'+list.length+' รายการ</span></div>'+
      (list.length?'<div class="grid">'+list.map(cardHTML).join("")+'</div>':'<div class="empty">ตอนนี้ไม่มีโปรโมชั่นหรืองานที่กำลังจัด</div>')+'</section>';
  }
  function branchOpts(){
    const t=todayISO();
    const cnt=id=>items().filter(p=>(id==="all"||(p.branches||[]).includes(id))&&status(p,t).k!=="off").length;
    return '<option value="all"'+(route==="all"?' selected':'')+'>ทุกสาขา ('+cnt("all")+')</option>'+
      state.branches.map(b=>'<option value="'+esc(b.id)+'"'+(route===b.id?' selected':'')+'>'+esc(b.name)+' ('+cnt(b.id)+')</option>').join("");
  }
  const statBtn=(key,n,label)=>'<button class="stat'+(filter===key?' on':'')+'" data-filter="'+key+'"><b>'+n+'</b><span>'+dotHTML(key)+label+'</span></button>';
  const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg>';
  function renderStore(){
    const g=groups(visible()), t=todayISO();
    let offPart="";
    if(filter==="off") offPart=section("off","หมดเขต / จบแล้ว",g.off);
    else if(filter==="all"&&g.off.length) offPart='<div class="clear"><button class="btn ghost" data-toggle-off>'+(showOff?"ซ่อน":"ดู")+'รายการที่หมดเขตแล้ว ('+g.off.length+')</button></div>'+(showOff?section("off","หมดเขต / จบแล้ว",g.off):"");
    const name=route==="all"?"ทุกสาขา":bName(route);
    app.innerHTML='<div class="wrap">'+
      '<div class="bar"><div class="bar-l">'+brandsHTML()+'<span class="kicker">Promotion Board</span></div><span class="date">'+fmt(t,"full")+'</span></div>'+
      '<div class="hero">'+logoHTML(route)+
        '<div class="hero-main"><div class="lbl">โปรโมชั่น &amp; กิจกรรมที่เข้าร่วม</div><h1 class="sr">'+esc(name)+'</h1>'+
        '<label class="bsel"><select id="bs" aria-label="เลือกสาขา">'+branchOpts()+'</select>'+CHEV+'</label></div>'+
        '<button class="btn" data-copy>คัดลอกสรุปส่งกลุ่ม</button></div>'+
      '<div class="stats">'+
        statBtn("active",g.active.length+g.soon.length,"กำลังจัดอยู่")+
        statBtn("soon",g.soon.length,"ใกล้หมด / วันนี้")+
        statBtn("up",g.up.length,"เร็ว ๆ นี้")+
        statBtn("off",g.off.length,"หมดเขตแล้ว")+
      '</div>'+
      (filter!=="all"?'<div class="clear"><button class="btn ghost" data-filter="all">← แสดงทั้งหมด</button></div>':'')+
      section("soon","ใกล้หมดเขต / วันนี้",g.soon)+
      section("active","กำลังจัดอยู่",g.active)+
      section("up","เร็ว ๆ นี้",g.up)+
      offPart+
      '<div class="foot"><span>อัปเดตข้อมูลล่าสุด '+fmt(state.updated,"long")+'</span><span>ข้อมูลจากทีมการตลาด '+esc(state.brand)+'</span></div>'+
    '</div>';
  }

  /* ================= MARKETING VIEW ================= */
  function saverHTML(){
    if(saving==="saving") return '<span class="saver">กำลังบันทึก…</span>';
    if(saving==="error") return '<span class="saver err">ยังไม่ได้บันทึก <button class="btn sm" data-retry>ลองอีกครั้ง</button></span>';
    if(saving==="readonly") return '<span class="saver err">บัญชีนี้ดูได้อย่างเดียว แก้ไขไม่ได้</span>';
    return '<span class="saver">'+dotHTML("active")+'ข้อมูลล่าสุด '+fmt(state.updated)+'</span>';
  }
  function branchSummary(p){
    const ids=(p.branches||[]).filter(id=>branch(id));
    if(!ids.length) return '<span style="color:var(--red)">ยังไม่ได้เลือกสาขา</span>';
    if(ids.length===state.branches.length) return "ทุกสาขา";
    if(ids.length<=2) return ids.map(bName).map(esc).join(", ");
    return esc(bName(ids[0]))+" และอีก "+(ids.length-1)+" สาขา";
  }
  function renderMarketing(){
    const t=todayISO();
    let list=items().filter(p=>mkType==="all"||(mkType==="event"?p.type==="event":p.type!=="event"))
      .map(p=>({p,st:status(p,t)})).filter(x=>mkTime==="off"?x.st.k==="off":x.st.k!=="off");
    const order={soon:0,active:1,up:2,off:3};
    list.sort((a,b)=>order[a.st.k]-order[b.st.k]||(a.st.k==="up"?a.p.start.localeCompare(b.p.start):a.st.k==="off"?b.p.end.localeCompare(a.p.end):a.p.end.localeCompare(b.p.end)));
    const rows=list.map(({p,st})=>'<div class="li st-'+st.k+'">'+
        '<div class="st">'+dotHTML(st.k)+esc(st.label)+'</div>'+
        '<div class="main"><div class="t">'+esc(p.title)+'</div><div class="s">'+esc(p.type==="event"?(p.client||p.location||""):(p.org||p.category||""))+'</div><span class="tag'+(p.type==="event"?' ev':'')+'">'+(p.type==="event"?"Coffee Giveaway":"Promotion")+'</span></div>'+
        '<div class="when">'+range(p)+(p.type==="event"&&time(p)?'<div class="s">'+time(p)+'</div>':'')+'</div>'+
        '<div class="br s">'+branchSummary(p)+'</div>'+
        '<div class="acts"><button class="btn sm ghost" data-edit="'+esc(p.id)+'">แก้ไข</button><button class="btn sm del" data-del="'+esc(p.id)+'">ลบ</button></div>'+
      '</div>').join("");
    app.innerHTML='<div class="wrap">'+
      '<div class="bar"><div class="bar-l">'+brandsHTML()+'<span class="kicker">Marketing · '+esc(state.brand)+'</span></div><span class="date">'+fmt(t,"full")+'</span></div>'+

  function summary(){

    const line=({p,st})=>{
      let s="• "+p.title+(p.type==="event"?" [งานแจกกาแฟ]":"")+"\n   "+range(p,"long")+(time(p)?" "+time(p):"")+" ("+st.label+")";

      if(p.cond) s+="\n   เงื่อนไข: "+p.cond;
      lines(p.staff).forEach(x=>s+="\n   – "+x);
      if(st.k==="up"&&p.prep) s+="\n   📦 "+p.prep+(p.prepDate?" ภายใน "+fmt(p.prepDate,"long"):"");
      if(route==="all"){const ids=p.branches||[];s+="\n   สาขา: "+(ids.length===state.branches.length?"ทุกสาขา":ids.map(bName).join(", "));}
      return s;
    };
    let s="📢 โปรโมชั่น/กิจกรรม "+(route==="all"?state.brand+" ทุกสาขา":bName(route))+"\nข้อมูล ณ "+fmt(t,"full")+"\n";

  /* ---------- data (Vercel API) ---------- */
  async function api(method,body){
    const opt={method,headers:{"Content-Type":"application/json"},cache:"no-store"};
    if(body){opt.body=JSON.stringify(body);opt.headers["x-admin-password"]=pw;}
    const r=await fetch("/api/data",opt);
    let j={};try{j=await r.json();}catch(e){}
    return {status:r.status,j};
  }
  async function load(){
    try{
      const {status,j}=await api("GET");
      if(status!==200) throw new Error("http "+status);
      dbOk=j.configured!==false;
      if(j.state&&Array.isArray(j.state.items)){state=j.state;}
      version=j.version||0;
    }catch(e){dbOk=false;}
    saved=clone(state);loaded=true;
    if(!ov.classList.contains("show")){readHash();render();}
  }
  function setPw(v){pw=v;try{v?sessionStorage.setItem("pb_pw",v):sessionStorage.removeItem("pb_pw");}catch(e){}}
  async function login(v){
    setPw(v);
    try{
      const {status,j}=await api("POST",{action:"check"});
      if(status===200) return "";
      setPw("");
      if(status===401) return "รหัสผ่านไม่ถูกต้อง";
      if(j.error==="no_password") return "ยังไม่ได้ตั้งค่า ADMIN_PASSWORD ใน Vercel";
      return "เข้าสู่ระบบไม่สำเร็จ ("+status+")";
    }catch(e){setPw("");return "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้";}
  }
  async function persist(){
    saving="saving";render();
    const next=clone(state); next.updated=todayISO();
    try{
      const {status,j}=await api("POST",{action:"save",version,state:next});
      if(status===200){state=next;saved=clone(next);version=j.version;saving="idle";render();toast("บันทึกแล้ว หน้าร้านเห็นข้อมูลใหม่แล้ว");return;}
      if(status===401){state=clone(saved);setPw("");saving="idle";render();toast("รหัสผ่านไม่ถูกต้อง กรุณาเข้าสู่ระบบใหม่");return;}
      if(status===409){state=j.state;saved=clone(j.state);version=j.version;saving="idle";render();toast("มีคนแก้ข้อมูลก่อนหน้า โหลดข้อมูลล่าสุดแล้ว กรุณาทำรายการอีกครั้ง");return;}
      if(status===503){saving="error";render();toast("ยังไม่ได้เชื่อมฐานข้อมูลใน Vercel");return;}
      throw new Error("http "+status);
    }catch(e){saving="error";render();toast("บันทึกไม่สำเร็จ ลองอีกครั้ง");}
  }

  /* ---------- events ---------- */
  app.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    const d=b.dataset;
    if(d.filter){filter=d.filter===filter?"all":d.filter;render();}
    else if("toggleOff" in d){showOff=!showOff;render();}
    else if("copy" in d) copySummary();
    else if(d.add) openForm(d.add,null);
    else if(d.edit){const p=items().find(x=>x.id===d.edit);if(p)openForm(p.type==="event"?"event":"promo",p);}
    else if(d.del){const p=items().find(x=>x.id===d.del);if(p)confirmDel(p);}
    else if("branches" in d) openBranches();
    else if("retry" in d) persist();
    else if("logout" in d){setPw("");render();}
    else if(d.mktype){mkType=d.mktype;render();}
    else if(d.mktime){mkTime=d.mktime;render();}
  });
  app.addEventListener("change",e=>{if(e.target.id==="bs") location.hash=e.target.value;});
